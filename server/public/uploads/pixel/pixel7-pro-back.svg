<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <filter id="sh-pixel7-pro-back">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
    <linearGradient id="gr-pixel7-pro-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#4b4b4b"/>
    </linearGradient>
    <linearGradient id="sg-pixel7-pro-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
    <clipPath id="clip-pixel7-pro-back">
      <rect x="128" y="150" width="144" height="260" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="#F3F0EC"/>

  <!-- Soft radial glow behind phone -->
  <ellipse cx="200" cy="280" rx="180" ry="200" fill="#17A07E22"/>

  <!-- Phone body -->
  <rect x="120" y="120" width="160" height="320"
        rx="20" fill="url(#gr-pixel7-pro-back)" filter="url(#sh-pixel7-pro-back)"/>

  <!-- Highlight shine on left edge -->
  <rect x="120" y="140" width="3" height="280"
        rx="2" fill="rgba(255,255,255,0.18)"/>

  <!-- Screen -->
  <rect x="128" y="150" width="144" height="260"
        rx="16" fill="url(#sg-pixel7-pro-back)"/>

  
  <!-- Back camera module (Google style - square island) -->
  <rect x="170" y="102" width="60" height="60"
        rx="14" fill="#3c3c3c"/>
  <circle cx="190" cy="122" r="14" fill="#111" stroke="#17A07E" stroke-width="1.5"/>
  <circle cx="190" cy="122" r="9" fill="#1a1a2e"/>
  <circle cx="190" cy="122" r="5" fill="#17A07E99"/>
  <circle cx="215" cy="122" r="10" fill="#111" stroke="#17A07E" stroke-width="1"/>
  <circle cx="190" cy="147" r="10" fill="#111" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Flash -->
  <circle cx="215" cy="147" r="5" fill="#FFC85C"/>

  <!-- Back Google logo -->
  <text x="200" y="340" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" font-weight="700"
        fill="rgba(255,255,255,0.2)" letter-spacing="3">GOOGLE</text>
  

  <!-- Camera bump (side) for front view -->
  

  <!-- Volume buttons -->
  <rect x="116" y="190" width="5" height="22" rx="2" fill="#464646"/>
  <rect x="116" y="218" width="5" height="22" rx="2" fill="#464646"/>

  <!-- Power button -->
  <rect x="279" y="210" width="5" height="30" rx="2" fill="#464646"/>

  
  <!-- Badge -->
  <rect x="120" y="96" width="40" height="20"
        rx="10" fill="#17A07E"/>
  <text x="140" y="110" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="9" font-weight="800"
        fill="white" letter-spacing="1">PRO</text>
  
</svg>