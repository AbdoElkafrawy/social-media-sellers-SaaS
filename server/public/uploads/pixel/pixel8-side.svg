<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <filter id="sh-pixel8-side">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
    <linearGradient id="gr-pixel8-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#38384c"/>
    </linearGradient>
    <linearGradient id="sg-pixel8-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <clipPath id="clip-pixel8-side">
      <rect x="128" y="150" width="144" height="260" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="#F3F0EC"/>

  <!-- Soft radial glow behind phone -->
  <ellipse cx="200" cy="280" rx="180" ry="200" fill="#4A90D922"/>

  <!-- Phone body -->
  <rect x="120" y="120" width="160" height="320"
        rx="20" fill="url(#gr-pixel8-side)" filter="url(#sh-pixel8-side)"/>

  <!-- Highlight shine on left edge -->
  <rect x="120" y="140" width="3" height="280"
        rx="2" fill="rgba(255,255,255,0.18)"/>

  <!-- Screen -->
  <rect x="128" y="150" width="144" height="260"
        rx="16" fill="url(#sg-pixel8-side)"/>

  
  <!-- Back camera module (Google style - square island) -->
  <rect x="170" y="102" width="60" height="60"
        rx="14" fill="#29293d"/>
  <circle cx="190" cy="122" r="14" fill="#111" stroke="#4A90D9" stroke-width="1.5"/>
  <circle cx="190" cy="122" r="9" fill="#1a1a2e"/>
  <circle cx="190" cy="122" r="5" fill="#4A90D999"/>
  <circle cx="215" cy="122" r="10" fill="#111" stroke="#4A90D9" stroke-width="1"/>
  <circle cx="190" cy="147" r="10" fill="#111" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Flash -->
  <circle cx="215" cy="147" r="5" fill="#FFC85C"/>

  <!-- Back Google logo -->
  <text x="200" y="340" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" font-weight="700"
        fill="rgba(255,255,255,0.2)" letter-spacing="3">GOOGLE</text>
  

  <!-- Camera bump (side) for front view -->
  

  <!-- Volume buttons -->
  <rect x="116" y="190" width="5" height="22" rx="2" fill="#333347"/>
  <rect x="116" y="218" width="5" height="22" rx="2" fill="#333347"/>

  <!-- Power button -->
  <rect x="279" y="210" width="5" height="30" rx="2" fill="#333347"/>

  
</svg>